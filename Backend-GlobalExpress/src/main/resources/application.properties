spring.application.name=GlobalExpress-SpringBoot

# --- Conexión a MySQL ---
# En tu computador funciona sin configurar nada (localhost:3306, base minimarket, root / 123456).
# En la nube (Render) estos valores se definen con variables de entorno: DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minimarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}

# Pocas conexiones: los servicios gratuitos en la nube tienen límites de memoria y de conexiones.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Las tablas ya las crea tu script SQL: Hibernate solo las usa, no las modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Render asigna el puerto en la variable PORT. En tu computador usa 8080.
server.port=${PORT:8080}

# Direcciones desde las que el React puede llamar a la API (separadas por coma).
# En Render se define con la variable CORS_ORIGINS (la URL de Netlify, sin "/" al final).
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}
